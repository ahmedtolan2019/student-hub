1/(j*j) تفقد معظم الحدود لأن البسط int.", "en": "This matches the first reference row. If only the first term contributes, inspect division types; 1/(j*j) discards most terms through integer division."}], "takeaway": {"ar": "اختبر حساب n واحدة قبل وضعه داخل حلقة أكبر.", "en": "Verify one n value before enclosing it in a larger loop."}, "code": ["int n=100;\ndouble sum=0;\nfor (int j=1; j<=n; ++j) {\n    sum=sum+1.0/(j*j);\n}\ndouble pi=sqrt(6*sum);\ncout << fixed << setprecision(6) << pi;"]}, {"title": {"ar": "إعادة الحساب لست قيم مختلفة", "en": "Repeat the calculation for six values"}, "paragraphs": [{"ar": "الحلقة الموجودة تحل قيمة واحدة من n. نحيطها بحلقة أخرى تختار n، ثم تترك الحلقة الداخلية تكمل جميع الحدود قبل الانتقال للقيمة التالية.", "en": "The existing loop solves one n. Enclose it in another loop that chooses n and waits for the inner loop to finish all terms before moving on."}, {"ar": "داخل صف n=200، تمر j من 1 إلى 200. بعدها فقط تطبع نتيجة 200 وتزيد n إلى 300؛ العدادات ليست بتتحرك بالتبادل خطوة بخطوة.", "en": "For the n=200 row, j traverses one through two hundred. Only then is the result printed and n advanced; the counters do not alternate one step each."}, {"ar": "لو صف 100 ترك مجموعًا، وصف 200 بدأ يضيف من j=1 لنفس المجموع، أول مئة حد تُحسب مرتين. تصفير sum داخل j أسوأ: سيمحو كل الحدود السابقة.", "en": "If the 200 row starts adding from j=1 into the previous sum, the first hundred terms are counted twice. Resetting inside j is also wrong: it erases prior terms every iteration."}], "takeaway": {"ar": "الحلقة الخارجية تختار التجربة، والداخلية تكمل حسابها بمجموع جديد.", "en": "The outer loop selects a calculation; the inner loop completes it from a fresh sum."}, "code": []}, {"title": {"ar": "تتبع التكرار الداخلي والخارجي", "en": "Trace inner and outer loops"}, "paragraphs": [{"ar": "نفس هيكل برنامج Q8، لكن بحدود قليلة يمكن تتبعها. كل مرة تبدأ تجربة جديدة لازم يبدأ sum من صفر وj من واحد.", "en": "This is the Q8 structure with small traceable limits. Every new calculation starts sum at zero and j at one."}, {"ar": "sum+=term اختصار sum=sum+term. جمعنا 1 ثم 1/4، وخرجنا من الحلقة الداخلية لما j زادت عن 2.", "en": "sum+=term abbreviates sum=sum+term. Add one then one quarter; the inner loop ends when j exceeds two."}, {"ar": "الطباعة تحصل مرة واحدة لهذه n. بعدها فقط تصل الحلقة الخارجية لسطر زيادة n.", "en": "Output happens once for this n. Only then does the outer update advance n."}, {"ar": "رجعنا إلى sum=0 لأننا سنجمع من j=1 من جديد. الحفاظ على 1.25 هنا سيكرر حدودًا من التجربة السابقة.", "en": "Reset because the next term loop starts again at one. Keeping 1.25 would duplicate earlier terms."}, {"ar": "أضفنا 1 و1/4 و1/9، ثم طبعنا التقريب. Q8 يكرر نفس الخطوات مع قيم 100 إلى 600 بدل هذا المثال المصغر.", "en": "Add one, one quarter and one ninth, then print the estimate. Q8 follows exactly this sequence with 100 through 600."}], "takeaway": {"ar": "الداخلية تنتهي قبل تحديث الخارجية؛ sum تعاد للصفر عند كل تجربة.", "en": "The inner loop finishes before the outer update; reset sum for each calculation."}, "code": ["for (int n=2; n<=3; ++n) {\n    double sum=0;\n    for (int j=1; j<=n; ++j) {\n        sum+=1.0/(j*j);\n    }\n    cout << sqrt(6*sum) << endl;\n}"]}, {"title": {"ar": "تنفيذ جدول Q8 كاملًا", "en": "Run the complete Q8 table"}, "paragraphs": [{"ar": "الطريقة الأساسية هنا نفس حل الدكتور: كل n تعيد حساب مجموعها من البداية. لا تخلطها بطريقة تجمع مرة واحدة وتطبع نقاطًا وسطية؛ لها مكان مختلف للتصفير.", "en": "This follows the professor: recompute the sum for each n. A running-sum alternative uses different reset placement; do not mix the two structures."}, {"ar": "n+=100 اختصار n=n+100. لو البداية 100 والنهاية 600 شاملة، يظهر ستة صفوف؛ الحلقة الداخلية يتغير طولها مع n.", "en": "n+=100 abbreviates n=n+100. Starting at one hundred and including six hundred gives six rows; the inner loop length depends on n."}, {"ar": "الأرقام تزيد وتقترب من π من تحت، لأننا نضيف حدودًا موجبة. اختلاف الترتيب ده علامة تستحق مراجعة التصفير أو القسمة، مش مجرد مشكلة شكل عرض.", "en": "Values increase toward pi from below because additional terms are positive. A broken trend calls for checking reset placement or division, not just formatting."}], "takeaway": {"ar": "جدول Q8 ست تجارب مستقلة، ولكل تجربة مجموع يبدأ من الصفر.", "en": "Q8 contains six independent calculations, each starting its sum from zero."}, "code": ["for (int n=100; n<=600; n+=100) {\n    double sum=0;\n    for (int j=1; j<=n; ++j) {\n        sum+=1.0/(j*j);\n    }\n    cout << n << \" \"\n         << sqrt(6*sum) << endl;\n}"]}], "code": "#include <iostream>\n#include <cmath>\n#include <iomanip>\nusing namespace std;\n\nint main()\n{\n    cout << fixed << setprecision(9);\n    for (int n=100; n<=600; n=n+100) {\n        double sum=0.0; // New complete sum for this n.\n        for (int j=1; j<=n; j=j+1) {\n            sum=sum+1.0/(j*j);\n        }\n        cout << n << \" \" << sqrt(6*sum) << endl;\n    }\n    return 0;\n}", "tests": [{"file": "Q_0308.cpp", "input": "", "stdout": "100 3.132076532\n200 3.136826306\n300 3.138413245\n400 3.139207406\n500 3.139684123\n600 3.140002027\n", "stderr": "", "exit": 0}]}, {"n": 9, "title": {"ar": "تقريب e أس x بحدود متتابعة", "en": "Approximate e to x using successive terms"}, "task": {"ar": "اقرأ x، واجمع حدود Taylor من رقم صفر إلى 15.", "en": "Read x and sum Taylor terms indexed zero through fifteen."}, "intuition": {"ar": "كل حد له بسط x^i ومقام i!. نبني factorial لحد واحد، نحسبه، ثم نضيفه إلى total. نكرر ذلك من i=0 حتى i=15؛ total تجمع الكل وfact تبدأ من جديد لكل حد.", "en": "Each term has numerator x^i and denominator i!. Build one factorial, calculate its term and add it to total. Repeat from i=0 through i=15; total spans all terms while fact restarts for each term."}, "formula": "total = 0;\nfor (int i=0; i<=15; ++i) {\n    double fact=1;\n    for (int j=2; j<=i; ++j) fact*=j;\n    total += pow(x,i)/fact;\n}", "plan": [{"ar": "تقريب e أس x باستخدام 16 حدًا من صفر إلى 15.", "en": "An e-to-x approximation with sixteen terms, zero through fifteen."}, {"ar": "x مدخل حقيقي وآخر index هو 15.", "en": "Real input x and final index fifteen."}, {"ar": "مفيش تحويل؛ استخدم double للحد والمجموع.", "en": "No unit conversion; use double for item and total."}, {"ar": "لكل i من صفر إلى 15: احسب fact من 1، ثم أضف pow(x,i)/fact للمجموع.", "en": "For each i from zero through fifteen, calculate fact starting at one, then add pow(x,i)/fact to the total."}, {"ar": "x=0 يعطي 1. قارن مع exp لمدخل صغير وكبير.", "en": "x=0 gives one. Compare against exp for a small and a large input."}], "boards": ["factorial", "exp-terms", "exp-one", "exp-nested", "exp-checks"], "trap": {"ar": "fact تبدأ بواحد داخل الحلقة الخارجية، وtotal تبدأ بصفر قبلها. لا تضف الحد قبل اكتمال factorial، ولا تصفّر total لكل i. الفهارس 0..15 تعني 16 حدًا.", "en": "Initialize fact to one inside the outer loop and total to zero before it. Add only after factorial is complete; do not reset total per i. Indices 0..15 mean sixteen terms."}, "quiz": {"ar": "بعد اكتمال factorial للـi الحالية، ما الخطوة التالية؟", "en": "Once the current factorial is complete, what comes next?"}, "opts": [{"ar": "صفّر total", "en": "Reset total"}, {"ar": "أضف pow(x,i)/fact إلى total", "en": "Add pow(x,i)/fact to total"}, {"ar": "أضف fact إلى total", "en": "Add fact to total"}], "ok": 1, "feedback": [{"ar": "التصفير يمسح الحدود السابقة. total لازم تفضل محفوظة بين الحدود.", "en": "Resetting erases earlier terms. Preserve total between terms."}, {"ar": "صح؛ البسط مقسوم على factorial يعطي الحد الحالي، ونضيفه مرة واحدة بعد اكتمال المقام.", "en": "Correct: power divided by factorial gives the current term; add it once after the denominator is complete."}, {"ar": "factorial هي المقام فقط، وليست الحد. احسب البسط واقسمه عليها.", "en": "Factorial is only the denominator, not the term. Calculate the numerator and divide by it."}], "retry": {"ar": "جرب x=2 لحد k=2 فقط واكتب item وtotal بعد كل دورة.", "en": "Try x=2 through k=2 and record item and total after each iteration."}, "retry_answer": {"ar": "بعد k=1: item=2,total=3. بعد k=2: item=2,total=5.", "en": "After k=1: item=2,total=3. After k=2: item=2,total=5."}, "reference_note": {"ar": "i=0 إلى i<=15 تنفذ 16 حدًا. رسالة المثال تقول using 15 terms، لكن عدد الحدود يتحدد من البداية والنهاية في الكود. هنا نتبع صيغة الشيت من صفر إلى 15 ونوضح العدد الفعلي.", "en": "i=0 through i<=15 executes sixteen terms. The example label says “using 15 terms”, but the bounds determine the count. Here we follow the sheet formula from zero through fifteen and state the actual count."}, "needs": [7, 8], "slide": 55, "lessons": [{"title": {"ar": "فهم factorial قبل كود Q9", "en": "Understand factorial before Q9 code"}, "paragraphs": [{"ar": "قبل الحلقة، نفهم العلامة !: factorial يعني حاصل ضرب الأعداد الصحيحة من 1 لحد العدد. هو وصف حساب، مش عاملًا جاهزًا نكتبه بعد المتغير في C++.", "en": "First explain !: factorial multiplies the integers from one through the given number. It is mathematical notation, not a C++ postfix operator."}, {"ar": "0! معرف بأنه 1، وده يخلي الحد عند i=0 يساوي 1. في حلقات الضرب نبدأ fact=1 ثم نضرب في 2 إلى i؛ لو i صفر أو واحد لا نحتاج أي ضرب.", "en": "Zero factorial is defined as one, making the i=0 term equal to one. Start fact at one and multiply from two to i; for zero or one no multiplication is needed."}, {"ar": "استخدم double لأن factorial يكبر بسرعة؛ حتى 13! يتجاوز int ذي 32 بت. هنا i يحدد factorial المطلوبة، وj يعد عمليات الضرب فقط.", "en": "Use double because factorial grows quickly; even 13! exceeds a 32-bit int. Here i selects the factorial, while j counts its multiplications."}], "takeaway": {"ar": "factorial تبدأ بواحد؛ حلقة 2 إلى i تحسبها وتتعامل تلقائيًا مع 0 و1.", "en": "Factorial starts at one; looping from two through i also handles zero and one correctly."}, "code": ["double fact=1;\nfor (int j=2; j<=i; ++j) {\n    fact=fact*j;\n}"]}, {"title": {"ar": "معنى حدود تقريب e^x", "en": "What the e^x approximation terms mean"}, "paragraphs": [{"ar": "e ثابت رياضي، لكن المطلوب ليس حفظ قيمته؛ المطلوب حساب تقريب للدالة عند x المدخلة. الأس i يحدد حدًا واحدًا، وليس عدد مرات ضرب الناتج النهائي.", "en": "e is a mathematical constant, but the task is to approximate its exponential function at input x. Index i selects a term, not a multiplier for the final answer."}, {"ar": "كل حد له بسط x^i ومقام i!. عند x=1 أول الحدود 1 ثم 1 ثم 1/2 ثم 1/6، فنقدر نراجع البرنامج بقيم سهلة.", "en": "Each term has numerator x^i and denominator i!. With x=1, the first terms are one, one, one half and one sixth, providing a simple trace."}, {"ar": "حل الدكتور يستخدم i<=15 ويحسب هذه الحدود، لكن عبارة المخرج تقول 15 terms. الحساب يطابق الصيغة؛ عدد الحدود في الوصف هو الذي يحتاج توضيحًا.", "en": "The professor’s loop uses i<=15 and computes these terms, though its output label says fifteen terms. The calculation matches the formula; clarify the label’s count."}], "takeaway": {"ar": "Q9 يجمع حدود الفهارس 0..15؛ الحد صفر قيمته 1 ويُحسب ضمن العدد.", "en": "Q9 sums indices 0..15; the zeroth term is one and counts as a term."}, "code": []}, {"title": {"ar": "حساب حد واحد قبل جمع الحدود", "en": "Calculate one term before summing terms"}, "paragraphs": [{"ar": "نفصل ثلاث مسؤوليات: اختيار i، حساب factorial الخاصة بها، ثم إضافة الحد. لو خلطناها سنكرر عاملًا أو نمسح مجموعًا بدون قصد.", "en": "Separate three jobs: choose i, calculate its factorial, then add the term. Mixing them risks duplicating factors or erasing the sum."}, {"ar": "عند x=2 وi=3، البسط 8 والمقام 6، فالحد 8/6. ده حد واحد وليس تقريب e^2 كله؛ لازم تضيف قبله 1 و2 و2.", "en": "For x=2,i=3, numerator is eight and denominator six, giving eight sixths. This is one term, not the full e² approximation; preceding terms include one, two and two."}, {"ar": "موضع السطرين بعد قوس حلقة j، لكن داخل حلقة i. لو جمعنا داخل حلقة factorial، سنضيف أجزاء غير مكتملة من نفس الحد.", "en": "Put these lines after the j loop closes but inside the i loop. Adding inside the factorial loop would use incomplete versions of the same term."}], "takeaway": {"ar": "كل i تنتج حدًا واحدًا بعد اكتمال factorial، ثم تضيفه مرة واحدة.", "en": "Each i produces one term after its factorial is complete, then adds it once."}, "code": ["double term=pow(x,i)/fact;\ntotal=total+term;"]}, {"title": {"ar": "تجميع برنامج تقريب e^x", "en": "Assemble the e^x approximation"}, "paragraphs": [{"ar": "المجموع total يجب أن يعيش طوال الحلقة الخارجية لأنه يجمع كل الحدود. fact تُعاد إلى 1 مع كل i لأن كل factorial تُحسب من البداية في هذه الطريقة.", "en": "total must survive the outer loop because it accumulates all terms. Reset fact to one for each i because this method rebuilds each factorial."}, {"ar": "قارن بـQ8: هناك sum تُصفّر لكل تجربة n؛ هنا total لا يُصفّر لكل حد i لأن كل الحدود تخص تجربة واحدة لقيمة x. دور المتغير هو اللي يحدد مكان البداية.", "en": "Compare Q8: sum resets for each separate n calculation. Here total does not reset for each i because all terms belong to one x calculation. The variable’s role determines initialization placement."}, {"ar": "الناتج قريب من exp(1) في cmath. نستخدم exp للمقارنة بعد بناء الحل، وليس بدل السلسلة التي يطلبها السؤال.", "en": "The result is close to cmath’s exp(1). Use exp to check the completed solution, not replace the series requested by the task."}], "takeaway": {"ar": "total يجمع كل الحدود؛ fact تخص حدًا واحدًا فتبدأ من جديد عنده.", "en": "total accumulates all terms; fact belongs to one term and resets for it."}, "code": ["double total=0;\nfor (int i=0; i<=15; ++i) {\n    double fact=1;\n    for (int j=2; j<=i; ++j) {\n        fact=fact*j;\n    }\n    total=total+pow(x,i)/fact;\n}"]}, {"title": {"ar": "حدود التقريب واختبارات Q9", "en": "Check Q9 and understand approximation limits"}, "paragraphs": [{"ar": "اختبارات البداية لازم تكون بسيطة ومفسرة. x=0 يجعل كل الحدود بعد الأول صفرًا، وx=1 يسمح بمقارنة مع قيمة معروفة.", "en": "Begin with simple interpretable tests. x=0 makes all terms after the first zero; x=1 allows a familiar comparison."}, {"ar": "كلما زاد حجم x، قد نحتاج حدودًا أكثر؛ ومع x السالب تتناوب الإشارات وقد يضيع بعض الدقة بسبب طرح قيم كبيرة. لذلك لا نصف البرنامج بأنه مطابق دائمًا للدالة.", "en": "Larger magnitudes may require more terms; negative x gives alternating signs and possible cancellation. Do not claim the finite series always equals the function."}, {"ar": "دي ملاحظة لطريقة recurrence في التلميح، مختلفة عن nested loops التي شرحناها. لو هتستخدمها، الحد التالي يساوي السابق في x مقسومًا على ترتيبه؛ لا تخلط بدايتها مع طريقة factorial.", "en": "This concerns the hint’s recurrence alternative, separate from our nested loops. Its next term is previous term times x divided by the new index; do not mix its initialization with the factorial method."}], "takeaway": {"ar": "اختبر x=0 وx=1، وافصل دقة التقريب عن صحة تنفيذ صيغة الشيت.", "en": "Test zero and one, and distinguish approximation accuracy from correct implementation of the sheet formula."}, "code": []}], "code": "#include <iostream>\n#include <cmath>\n#include <iomanip>\nusing namespace std;\n\nint main()\n{\n    double x;\n    cout << \"x: \"; cin >> x;\n    double total=0.0;\n    // Indices 0..15 include sixteen terms, with 0! = 1.\n    for (int i=0; i<=15; i=i+1) {\n        double fact=1.0;\n        for (int j=2; j<=i; j=j+1) {\n            fact=fact*j;\n        }\n        total=total+pow(x,i)/fact;\n    }\n    cout << fixed << setprecision(9) << \"Approximation = \" << total << endl;\n    cout << \"exp(x) check = \" << exp(x) << endl;\n    return 0;\n}", "tests": [{"file": "Q_0309.cpp", "input": "0", "stdout": "x: Approximation = 1.000000000\nexp(x) check = 1.000000000\n", "stderr": "", "exit": 0}, {"file": "Q_0309.cpp", "input": "1", "stdout": "x: Approximation = 2.718281828\nexp(x) check = 2.718281828\n", "stderr": "", "exit": 0}, {"file": "Q_0309.cpp", "input": "2", "stdout": "x: Approximation = 7.389056095\nexp(x) check = 7.389056099\n", "stderr": "", "exit": 0}, {"file": "Q_0309.cpp", "input": "-1", "stdout": "x: Approximation = 0.367879441\nexp(x) check = 0.367879441\n", "stderr": "", "exit": 0}, {"file": "Q_0309.cpp", "input": "10", "stdout": "x: Approximation = 20952.886968607\nexp(x) check = 22026.465794807\n", "stderr": "", "exit": 0}]}, {"n": 10, "title": {"ar": "أكبر قاسم مشترك بطريقة الشيت", "en": "Greatest common divisor using the sheet method"}, "task": {"ar": "اقرأ عددين صحيحين موجبين. ابدأ بالأصغر وافحص القواسم تنازليًا لحد أول قاسم مشترك.", "en": "Read two positive integers. Start at the smaller and test downward until finding a common divisor."}, "intuition": {"ar": "لو بتدور من الكبير للصغير، أول نجاح هو أكبر نجاح ممكن. لازم المرشح يقسم العددين معًا، مش واحد منهم فقط.", "en": "Searching from larger to smaller makes the first success the greatest possible success. A candidate must divide both numbers, not just one."}, "formula": "for (int i=min(n1,n2); i>=1; --i) {\n    if (n1%i==0 && n2%i==0) { gcd=i; break; }\n}", "plan": [{"ar": "GCD كعدد صحيح موجب.", "en": "The GCD as a positive integer."}, {"ar": "مدخلان موجبان n1 وn2.", "en": "Positive inputs n1 and n2."}, {"ar": "لا تحويل؛ % لباقي القسمة الصحيحة.", "en": "No conversion; % computes integer remainder."}, {"ar": "ابدأ بالأصغر وانقص واحد. عند نجاح القسمة على العددين احفظ المرشح واخرج بـbreak.", "en": "Start at the smaller input and decrease by one. When both divide evenly, save the candidate and exit with break."}, {"ar": "18 و12 يعطيان 6، و17 و13 يعطيان 1؛ ارفض الصفر.", "en": "18 and 12 give six; 17 and 13 give one; reject zero."}], "boards": ["divisor", "gcd-plan", "gcd-and", "gcd-code", "solve-plan"], "trap": {"ar": "شرط النجاح يستخدم && لأن المرشح لازم يقسم العددين. بعد النجاح استخدم break؛ الاستمرار مع استبدال gcd سيصل لقاسم أصغر.", "en": "The success test uses && because a candidate must divide both inputs. Use break on success; continuing to overwrite gcd would replace it with smaller divisors."}, "quiz": {"ar": "مع 18 و12 وd=12، هل نكمل البحث؟", "en": "For 18 and 12 with d=12, do we continue?"}, "opts": [{"ar": "نعم، لأن 18 فيها باقي", "en": "Yes, because 18 leaves a remainder"}, {"ar": "لا، لأن 12 تقبل القسمة", "en": "No, because 12 divides evenly"}, {"ar": "نقف عند صفر", "en": "Stop at zero"}], "ok": 0, "feedback": [{"ar": "صح، لازم الباقيان يبقوا صفر عشان نقف.", "en": "Yes: both remainders must be zero to stop."}, {"ar": "نجاح عدد واحد مش قاسم مشترك. افحص باقي 18 كمان.", "en": "Dividing one input is not enough; also inspect the remainder of eighteen."}, {"ar": "القسمة على صفر غير صالحة. المدخلات الموجبة تضمن توقفًا عند 1 على الأقل.", "en": "Remainder by zero is invalid. Positive inputs guarantee a stop at one or earlier."}], "retry": {"ar": "جرب 14 و21، ثم جرب 9 و9.", "en": "Try fourteen and twenty-one, then nine and nine."}, "retry_answer": {"ar": "النتيجتان 7 و9. لو العددان متساويان، أول مرشح ينجح فورًا.", "en": "The results are seven and nine. Equal inputs succeed at the initial candidate."}, "reference_note": {"ar": "المرجع يستخدم && لاختبار نجاح العددين، ثم break. مثال 70 و84 يعطي 14. أضف <algorithm> عند استخدام min بدل الاعتماد على إن مكتبة تانية ضمتها بالصدفة.", "en": "The reference uses && to test both inputs, then break. Its example 70 and 84 gives fourteen. Include <algorithm> for min rather than relying on another header to include it indirectly."}, "needs": [4, 6, 7], "slide": 62, "lessons": [{"title": {"ar": "معنى القاسم المشترك الأكبر", "en": "What greatest common divisor means"}, "paragraphs": [{"ar": "تخيل 18 قطعة و12 قطعة، وعايز تقسيم كل مجموعة إلى حزم بنفس الحجم بدون بواقي. حجم الحزمة لازم يقسم العددين، ونبحث عن أكبر حجم ممكن.", "en": "Imagine eighteen items and twelve items, each packed into equal-size bundles with nothing left over. The bundle size must divide both counts; choose the largest size."}, {"ar": "رجعنا لـ% من Q4، لكن هنا نبحث عن باقي صفر بدل تقليل مدى زاوية. المقارنة == تختبر الباقي ولا تغير أي متغير.", "en": "Reuse % from Q4, now checking for a zero remainder rather than limiting a direction’s range. The == comparison tests the remainder without assigning."}, {"ar": "إيجاد أي قاسم مشترك ليس كافيًا. نحتاج ترتيب بحث يجعل أول نجاح نصل له هو الأكبر؛ هنبدأ من أكبر مرشح ممكن وننزل.", "en": "Any common divisor is insufficient. Search in an order where the first success is greatest: begin at the largest possible candidate and descend."}], "takeaway": {"ar": "القاسم المشترك يقسم العددين؛ الأكبر يُثبت بترتيب البحث.", "en": "A common divisor divides both numbers; the greatest is established by search order."}, "code": ["18 % 6 == 0  // divides exactly\n12 % 6 == 0  // divides exactly\n18 % 4 == 2  // remainder exists"]}, {"title": {"ar": "اختيار نقطة بداية البحث عن القاسم", "en": "Choose where to start the divisor search"}, "paragraphs": [{"ar": "لو العدد الأصغر 12، مستحيل نقسمه لحزم حجمها 13 أو أكثر بدون باقي. إذن لا داعي لتجربة مرشحين أكبر من الأصغر.", "en": "If the smaller count is twelve, it cannot divide into exact bundles of thirteen or more. There is no need to try larger candidates."}, {"ar": "min ترجع القيمة الأصغر وتحتاج header algorithm لضمان توفرها. في حل الدكتور ظهرت min؛ الاعتماد على وصولها من header آخر يختلف بين المكتبات.", "en": "min returns the smaller value and requires algorithm for portable declaration. The professor uses min; relying on another header to expose it is implementation-dependent."}, {"ar": "12 يقسم العدد الثاني فقط، فلا يكفي. ننقص المرشح واحدًا في كل مرة لحد 6؛ لأننا نزلنا من فوق، كل مرشح أكبر جُرّب وفشل.", "en": "Twelve divides only the second input, so it fails. Descend one at a time to six; every larger candidate has already been tried and rejected."}], "takeaway": {"ar": "ابدأ من min ثم انزل؛ أول مرشح يقسم العددين هو الأكبر.", "en": "Start at min and descend; the first candidate dividing both is greatest."}, "code": ["#include <algorithm>\nint d = min(n1,n2);"]}, {"title": {"ar": "شرط نجاح يحتاج القسمة على العددين", "en": "A success condition requiring both divisions"}, "paragraphs": [{"ar": "دي حالة AND، وعلامتها &&. OR المستخدمة في الرفض قبل كده كانت تعني أي سبب يكفي؛ هنا لا يكفي نجاح نصف المطلوب.", "en": "This requires AND, written &&. Earlier OR rejection guards accepted any failure reason; here satisfying only half the requirement is insufficient."}, {"ar": "break تخرج فورًا من أقرب حلقة محيطة. نحتاجها هنا لأننا وجدنا الأكبر بالفعل؛ الاستمرار مع تحديث gcd سيستبدله بقواسم أصغر.", "en": "break immediately exits the nearest enclosing loop. It is appropriate because the greatest divisor has been found; continuing to overwrite gcd would replace it with smaller divisors."}, {"ar": "شرط المدخلات الموجبة جزء من هذا التبرير. ارفض الصفر والسالب أولًا؛ القسمة أو الباقي على صفر غير مسموحين.", "en": "Positive-input validation is part of that guarantee. Reject zero and negatives first; division or remainder by zero is invalid."}], "takeaway": {"ar": "&& يثبت القسمة على الاثنين؛ break يحفظ أول نجاح في البحث التنازلي.", "en": "&& verifies both divisions; break preserves the first success in descending search."}, "code": ["if (n1%d==0 && n2%d==0) {\n    gcd=d;\n    break;\n}"]}, {"title": {"ar": "تجميع البحث التنازلي في Q10", "en": "Assemble the Q10 descending search"}, "paragraphs": [{"ar": "كل الأجزاء اتشرحت: for للتحكم، % لاختبار الباقي، && لنجاح الشرطين، وbreak لإيقاف البحث عند أكبر قاسم. دلوقتي نضعهم معًا.", "en": "Each piece is now familiar: for controls the search, % computes remainders, && requires both tests and break stops at the greatest divisor. Combine them now."}, {"ar": "--d ينقص المرشح بعد كل محاولة فاشلة. نجاح if ينفذ break قبل هذا التحديث، فتحفظ gcd المرشح الصحيح.", "en": "--d decrements the candidate after each failed attempt. A successful if executes break before another decrement, preserving the accepted divisor."}, {"ar": "المثال الأول يطابق الدكتور، والأعداد التي لا تشترك في قاسم أكبر من 1 تختبر نهاية البحث. المدخلان المتساويان يختبران نجاح أول مرشح.", "en": "The first matches the professor. Inputs sharing no divisor greater than one test the end of the search; equal inputs test immediate success."}], "takeaway": {"ar": "Q10 بحث تنازلي له سبب بداية واضح وشرط نجاح وسبب توقف.", "en": "Q10 is a descending search with justified start, success and termination conditions."}, "code": ["int gcd=1;\nfor (int d=min(n1,n2); d>=1; --d) {\n    if (n1%d==0 && n2%d==0) {\n        gcd=d;\n        break;\n    }\n}\ncout << gcd;"]}, {"title": {"ar": "بدء الحل من المطلوب قبل الكود", "en": "Start from the requirement before code"}, "paragraphs": [{"ar": "الخطة ليست شكلًا للحفظ؛ هي طريقة تكشف لو كنت فاهم المدخلات والوحدات وترتيب الحساب. استخدم Q10 الآن، ثم كررها لسؤال هندسة وسؤال متسلسلة.", "en": "The plan exposes whether inputs, units and calculation order are understood. Apply it to Q10 now, then to a geometry question and a series question."}, {"ar": "ليس لازم كل سؤال يحتاج تحويلًا. في Q3 كان تحويل درجات، لكن في Q10 الأنواع أصلًا int لأن باقي القسمة عملية على أعداد صحيحة.", "en": "Not every problem needs conversion. Q3 converts angle units; Q10 retains integers because remainder is an integer operation."}, {"ar": "اختبار واحد من المثال لا يكفي لكل الأخطاء. اختر حالة لها نتيجة واضحة، وحالة عند حد أو تفرع: مدخل غير صالح أو أول نجاح أو آخر نجاح.", "en": "One sample cannot expose every mistake. Choose an obvious result and a boundary or branch: invalid input, immediate success or last-candidate success."}], "takeaway": {"ar": "الخطة تربط معنى السؤال بالحساب وبطريقة إثبات صحته.", "en": "A plan connects the problem’s meaning to calculation and verification."}, "code": []}], "code": "#include <iostream>\n#include <algorithm>\nusing namespace std;\n\nint main()\n{\n    int n1,n2;\n    cout << \"Two positive integers: \"; cin >> n1 >> n2;\n    if (n1 <= 0 || n2 <= 0) { cout << \"Use positive integers\" << endl; return 0; }\n    int d=min(n1,n2), gcd=1;\n    for (int i=d; i>=1; i=i-1) {\n        if (n1%i == 0 && n2%i == 0) {\n            gcd=i;\n            break; // Descending order makes the first match the greatest.\n        }\n    }\n    cout << \"GCD = \" << gcd << endl;\n    return 0;\n}", "tests": [{"file": "Q_0310.cpp", "input": "18 12", "stdout": "Two positive integers: GCD = 6\n", "stderr": "", "exit": 0}, {"file": "Q_0310.cpp", "input": "17 13", "stdout": "Two positive integers: GCD = 1\n", "stderr": "", "exit": 0}, {"file": "Q_0310.cpp", "input": "9 9", "stdout": "Two positive integers: GCD = 9\n", "stderr": "", "exit": 0}, {"file": "Q_0310.cpp", "input": "1 8", "stdout": "Two positive integers: GCD = 1\n", "stderr": "", "exit": 0}, {"file": "Q_0310.cpp", "input": "0 4", "stdout": "Two positive integers: Use positive integers\n", "stderr": "", "exit": 0}, {"file": "Q_0310.cpp", "input": "70 84", "stdout": "Two positive integers: GCD = 14\n", "stderr": "", "exit": 0}, {"file": "Q_0310.cpp", "input": "20 12", "stdout": "Two positive integers: GCD = 4\n", "stderr": "", "exit": 0}, {"file": "Q_0310.cpp", "input": "7 11", "stdout": "Two positive integers: GCD = 1\n", "stderr": "", "exit": 0}, {"file": "Q_0310.cpp", "input": "8 8", "stdout": "Two positive integers: GCD = 8\n", "stderr": "", "exit": 0}, {"file": "Q_0310.cpp", "input": "14 21", "stdout": "Two positive integers: GCD = 7\n", "stderr": "", "exit": 0}, {"file": "Q_0310.cpp", "input": "21 14", "stdout": "Two positive integers: GCD = 7\n", "stderr": "", "exit": 0}]}], "foundations": [{"title": {"ar": "الزاوية اللي دالة C++ مستنياها", "en": "The angle a C++ function expects"}, "slide": 5, "takeaway": {"ar": "راجع مدخل الدالة ووحدته قبل ما تكتب الحساب.", "en": "Check a function’s input and unit before using it."}, "text": [{"ar": "هنا سبب الكلام عن radians: دالة tan اللي محتاجينها للقانون لها وحدة محددة للمدخل. رقم الزاوية لوحده مش كفاية؛ 90 degrees مش نفس زاوية 90 radians.", "en": "This is why radians matter: the tan function needed by our formula has a specific input unit. The number alone is insufficient; 90 degrees is not the same angle as 90 radians."}, {"ar": "الأقواس بعد اسم الدالة تحط فيها المدخل، والدالة ترجع قيمة نقدر نخزنها. cmath هو الـheader اللي يتيح أسماء دوال الرياضيات؛ مش محتاجين نكتب طريقة حساب sin من جوه.", "en": "The parentheses hold the input and the call returns a value we can store. The cmath header supplies math functions; we do not implement sine ourselves."}, {"ar": "دي زي دالة مستنية طول بالمتر وإنت معاك سنتيمتر. قبل التعويض لازم الوحدات تتفق، فهنفهم دلوقتي الوحدة الجديدة بدل ما نحفظ معامل تحويل.", "en": "Think of a calculation expecting metres when your measurement is in centimetres. Units must agree before substitution; next we explain this unit rather than just memorize a conversion."}], "code": ["#include <cmath>\n// function_name(input)\ndouble result = sin(angle);"]}, {"title": {"ar": "معنى قياس الزاوية بالـradians", "en": "What measuring an angle in radians means"}, "slide": 6, "takeaway": {"ar": "radians تقيس طول القوس بالنسبة لنصف القطر؛ اللفة الكاملة 2π.", "en": "Radians measure arc length relative to radius; a full turn is 2π."}, "text": [{"ar": "ابدأ بشعاع من المركز لليمين. لما يلف، نهايته تمشي مسافة على محيط الدائرة؛ قياس radians هو طول القوس مقسوم على نصف القطر.", "en": "Start with a radius pointing right. As it turns, the tip travels along the circle; the radian measure is arc length divided by radius."}, {"ar": "محيط الدائرة 2πr؛ لما نقسمه على r نحصل على 2π. ده يفسر ليه π تظهر في قياس الزوايا؛ نصف لفة 180 degrees يساوي π radians.", "en": "A full circumference is 2πr; dividing by r gives 2π. That explains pi in angle measurement: half a turn is 180 degrees or pi radians."}, {"ar": "المؤشر وصل لفوق، نفس الوضع في الوحدتين. إحنا غيرنا الرقم والوحدة، مش اتجاه المؤشر؛ دلوقتي نقدر نكتب التحويل.", "en": "The pointer now points up in either unit. We changed the numerical measure and unit, not the direction; we can now write the conversion."}], "code": []}, {"title": {"ar": "تحويل degrees قبل استدعاء sin", "en": "Convert degrees before calling sin"}, "slide": 7, "takeaway": {"ar": "من degrees إلى radians نضرب في PI/180؛ لا نحول قيمة هي أصلًا radians.", "en": "Multiply degrees by PI/180; do not reconvert values already in radians."}, "text": [{"ar": "عايزين نحسب sin لزاوية قائمة نعرف أن قيمتها 1. نبدأ بمدخل 90 degrees ونحافظ على نفس الزاوية أثناء تغيير الوحدة.", "en": "We want the sine of a right angle, whose value we know is one. Begin with 90 degrees and preserve that angle while changing its unit."}, {"ar": "الضرب في PI/180 ينقل degrees إلى radians. PI هنا ثابت: كلمة const تمنع تغيير قيمته بالغلط أثناء البرنامج.", "en": "Multiplying by PI/180 converts degrees to radians. PI is a constant here: const prevents accidental changes during the program."}, {"ar": "الدالة لا تعرف إن رقم 90 عندك مكتوب بالـdegrees. sin(90) لا تعمل التحويل بنفسها، لذلك التحويل مسؤولية الكود قبل الاستدعاء.", "en": "The function cannot infer that your 90 means degrees. sin(90) does not convert for you; conversion must happen before the call."}], "code": ["const double PI = 3.141592653589793;\ndouble degrees = 90;\ndouble radians = degrees * PI / 180.0;\ndouble result = sin(radians);"]}, {"title": {"ar": "مكان الحساب داخل البرنامج", "en": "Where the calculation belongs in a program"}, "slide": 11, "takeaway": {"ar": "تتبع المدخل من cin إلى المتغير إلى الحساب ثم cout.", "en": "Follow input from cin to the variable, calculation and cout."}, "text": [{"ar": "هنحط حساب Q1 بين القراءة والعرض. double يحفظ أطوالًا ونتائج فيها كسور، وint مناسب لعدد الأضلاع الصحيح.", "en": "Place Q1’s calculation between input and output. double holds fractional lengths and results; int is appropriate for the whole-number side count."}, {"ar": "using namespace std يسمح بكتابة cin بدل std::cin في أسلوب الكورس. الأقواس المعقوفة تجمع جسم main، وreturn 0 تنهي البرنامج بصورة عادية.", "en": "using namespace std permits cin rather than std::cin in the course style. Braces enclose main’s body, and return 0 finishes normally."}, {"ar": "المسميات n وs أماكن لتخزين القيم. لو دخلت 6 ثم 5 يبقى عندنا ستة أضلاع طول كل واحد خمسة؛ بدل إدخال البرنامج كله مرة واحدة، راقب كل مرحلة.", "en": "The variables n and s store values. Entering six then five describes six edges of length five; inspect each stage rather than treating the program as one opaque block."}], "code": ["#include <iostream>\n#include <cmath>\nusing namespace std;\nint main() {\n    int n; double s;\n    cin >> n >> s;\n    // calculation goes here\n    return 0;\n}"]}, {"title": {"ar": "نقل قانون الكسر إلى C++", "en": "Translate a fraction into C++"}, "slide": 10, "takeaway": {"ar": "اكتب الضرب والتجميع صراحة؛ نجاح البناء لا يثبت صحة القانون.", "en": "Write multiplication and grouping explicitly; compilation does not prove the formula."}, "text": [{"ar": "الكمبيوتر ينفذ العمليات المكتوبة، مش الشكل اللي في دماغنا. هنكتب البسط والمقام كحسابين واضحين قبل ما نقسم.", "en": "The computer follows written operators, not the formula we have in mind. Write numerator and denominator separately before dividing."}, {"ar": "النجمة تعني ضرب. s*s تربيع؛ ممكن pow(s,2) من cmath، لكن ^ ليست أسًا في C++. علامة = تخزن نتيجة الطرف اليمين في اسم الطرف الشمال.", "en": "An asterisk means multiplication. s*s squares; cmath also provides pow(s,2), but ^ is not exponentiation in C++. The equals sign stores the right-hand result in the left-hand variable."}, {"ar": "الأقواس حول المقام ضرورية. كتابة /4*tan تقسم على 4 ثم تضرب في tan؛ الكود قد يُبنى لكن يكون بيحسب قانونًا مختلفًا.", "en": "Parentheses around the divisor matter. /4*tan divides by four and then multiplies by tan; it may compile while computing the wrong formula."}], "code": ["double numerator = n * s * s;\ndouble denominator = 4 * tan(PI / n);\ndouble area = numerator / denominator;", "double area = n*s*s / (4*tan(PI/n));"]}, {"title": {"ar": "دالة acos تعكس اتجاه الحساب", "en": "acos reverses the calculation"}, "slide": 16, "takeaway": {"ar": "acos تحول نسبة إلى زاوية radians؛ حول المخرج فقط لو مطلوب degrees.", "en": "acos converts a ratio to radians; convert its output only when degrees are required."}, "text": [{"ar": "اسم acos معناه inverse cosine، أي إيجاد الزاوية من قيمة cos. دي مش قسمة 1 على cos؛ إحنا بنعكس السؤال اللي بنسأله للدالة.", "en": "acos means inverse cosine: recover an angle from its cosine. It is not one divided by cosine; we are reversing the question asked of the function."}, {"ar": "حط أطول ضلع 5 مقابل A. البسط صفر، ونعرف من المثلث القائم إن زاوية A لازم تكون 90 degrees؛ ده اختبار لمعنى الدالة.", "en": "Put the longest side, five, opposite A. The numerator is zero, and we know A must be 90 degrees; this gives a check on the inverse operation."}, {"ar": "acos ترجع radians. في Q2 مطلوب عرض الزوايا بالـdegrees، لذلك التحويل هنا بعد الدالة، بمعامل 180/PI عكس تحويل المدخل السابق.", "en": "acos returns radians. Q2 displays degrees, so convert after the call using 180/PI, reversing our earlier input conversion."}], "code": ["double u = (b*b+c*c-a*a)/(2*b*c);\ndouble A = acos(u);\ndouble A_degrees = A * 180.0 / PI;"]}, {"title": {"ar": "طريقة عمل while", "en": "How while repeats work"}, "slide": 26, "takeaway": {"ar": "while تفحص ثم تنفذ ثم تعيد الفحص؛ التحديث هو اللي يسمح بالتوقف.", "en": "while tests, executes and retests; updating state enables termination."}, "text": [{"ar": "الجسم هو السطور بين الأقواس المعقوفة. لو الشرط غلط من البداية، الجسم لا يتنفذ أصلًا؛ ولو مفيش حاجة تغيره ممكن نستمر بلا نهاية.", "en": "The body is the statements between braces. A false initial test skips the body entirely; if nothing can change the test, repetition may never end."}, {"ar": "نبدأ بمثال صغير قبل حد 30000. الشرط i<=3 يسمح بالأعداد 1 و2 و3، والجسم يطبع ثم يغير i علشان الاختبار القادم يبقى على قيمة جديدة.", "en": "Start smaller than 30000. The test i<=3 permits one, two and three; the body prints and then updates i so the next test sees a new value."}, {"ar": "التوقف مش لأن البرنامج عرف لوحده إنه طبع ثلاثة أعداد. التوقف نتيجة محددة: الشرط بقى غلط بعد التحديث.", "en": "The program does not intuit that three numbers were enough. It stops for a precise reason: the update made the condition false."}], "code": ["int i=1;\nwhile (i<=3) {\n    cout << i << endl;\n    i=i+1;\n}"]}, {"title": {"ar": "تتبع التنفيذ سطرًا بسطر", "en": "Trace execution one line at a time"}, "slide": 27, "takeaway": {"ar": "القيمة المخزنة والمخرج مختلفان؛ ارسم عمودًا لكل واحد أثناء التتبع.", "en": "Stored state and output differ; trace each in its own column."}, "text": [{"ar": "اللون يحدد السطر الجاري في الشرح، مش تنفيذًا حيًا للكود. أرقام التتبع مأخوذة من تشغيل المثال؛ ارجع خطوة وشوف إزاي نفس الحالة ترجع.", "en": "The highlight marks the line discussed, not a live interpreter. The trace matches the executed example; step backward to restore earlier state."}, {"ar": "الشرط صحيح؛ نطبع 1. الطباعة لا تغير i، فلازم نصل لسطر التحديث بعدها.", "en": "The test is true, so print one. Printing does not change i; execution must reach the update."}, {"ar": "التحديث جعل i تساوي 2. رجعنا للشرط قبل الطباعة التالية، لذلك ظهرت 2 بعد نجاح الفحص.", "en": "The update stored two. The test ran again before the next print, allowing two into the output."}, {"ar": "<= تشمل المساواة، فالقيمة 3 تدخل الجسم. لو الشرط <3 كنا توقفنا قبلها.", "en": "<= includes equality, so three enters the body. A test of <3 would have stopped earlier."}, {"ar": "التحديث الأخير يخزن 4، لكن الفحص يمنع طباعتها. قيمة العداد بعد الحلقة ليست بالضرورة آخر قيمة ظهرت.", "en": "The last update stores four, but the test prevents printing it. The final counter need not equal the final printed value."}], "code": ["int i=1;\nwhile (i<=3) {\n    cout << i << endl;\n    i=i+1;\n}"]}, {"title": {"ar": "القسمة الصحيحة قد تضيع الكسر", "en": "Integer division can discard the fraction"}, "slide": 32, "takeaway": {"ar": "لحساب كسر: استخدم طرفًا real في القسمة وخزّن الناتج في double.", "en": "For a fraction, use a real division operand and a double destination."}, "text": [{"ar": "دي نقطة مهمة في Q7 وQ8. تغيير نوع المتغير المستقبِل إلى double لا يرجع كسرًا ضاع بالفعل أثناء حساب الطرف اليمين.", "en": "This matters in Q7 and Q8. A double destination cannot recover a fraction already discarded on the right-hand side."}, {"ar": "في السطر الأول 1 و5 من نوع int، فالقسمة الصحيحة تعطي صفر. في الثاني وجود 1.0 يجعل القسمة real فتحفظ خمس الواحد.", "en": "In the first line, both operands are int, so integer division yields zero. In the second, 1.0 makes the calculation real and preserves one fifth."}, {"ar": "السطر الثالث يحسب 0.2 لكن يخزنها في int، فيفقد الكسر عند التخزين. نحتاج قسمة مناسبة ونوع تخزين مناسب معًا.", "en": "The third calculation produces 0.2 but loses the fraction when stored in int. Both the calculation and the destination type must preserve fractions."}], "code": ["double a = 1 / 5;    // 0\ndouble b = 1.0 / 5;  // 0.2", "int c = 1.0 / 5;     // 0\ndouble term = 1.0/d; // preserves the fraction"]}, {"title": {"ar": "تجميع أجزاء الحلقة في for", "en": "Group loop controls with for"}, "slide": 34, "takeaway": {"ar": "for تبدأ مرة واحدة؛ ثم تختبر وتنفذ الجسم وتحدث العداد بالترتيب.", "en": "for initializes once, then tests, executes the body and updates in that order."}, "text": [{"ar": "هنقرأ صيغة الدكتور في Q7. for ليست فكرة تكرار جديدة؛ نفس أجزاء while السابقة مكتوبة في أماكن محددة.", "en": "This lets us read the professor’s Q7 loop. for is not a new repetition model; it places familiar loop controls in a compact header."}, {"ar": "الجزء الأول مرة واحدة، الشرط قبل كل دورة، والتحديث بعد الجسم. الفواصل المنقوطة داخل الرأس تفصل الأجزاء الثلاثة؛ لا تضع فاصلة منقوطة بعد القوس قبل الجسم.", "en": "Initialization runs once, the test before each iteration and the update after the body. Header semicolons separate the three parts; do not add one between the header and body."}, {"ar": "97 داخلة لأن الشرط <=. بعد استخدامها يزيد d إلى 101 ثم يفشل الفحص؛ الناتج يحتوي 24 عاملًا، من فرق 97 و5 مقسومًا على 4 ثم إضافة البداية.", "en": "97 is included by <=. After using it, d advances to 101 and fails. There are 24 factors: (97-5)/4 plus one for the starting value."}], "code": ["for (int d=5; d<=97; d=d+4) {\n    product = product * (1.0/d);\n}"]}, {"title": {"ar": "إعادة الحساب لست قيم مختلفة", "en": "Repeat the calculation for six values"}, "slide": 51, "takeaway": {"ar": "الحلقة الخارجية تختار التجربة، والداخلية تكمل حسابها بمجموع جديد.", "en": "The outer loop selects a calculation; the inner loop completes it from a fresh sum."}, "text": [{"ar": "الحلقة الموجودة تحل قيمة واحدة من n. نحيطها بحلقة أخرى تختار n، ثم تترك الحلقة الداخلية تكمل جميع الحدود قبل الانتقال للقيمة التالية.", "en": "The existing loop solves one n. Enclose it in another loop that chooses n and waits for the inner loop to finish all terms before moving on."}, {"ar": "داخل صف n=200، تمر j من 1 إلى 200. بعدها فقط تطبع نتيجة 200 وتزيد n إلى 300؛ العدادات ليست بتتحرك بالتبادل خطوة بخطوة.", "en": "For the n=200 row, j traverses one through two hundred. Only then is the result printed and n advanced; the counters do not alternate one step each."}, {"ar": "لو صف 100 ترك مجموعًا، وصف 200 بدأ يضيف من j=1 لنفس المجموع، أول مئة حد تُحسب مرتين. تصفير sum داخل j أسوأ: سيمحو كل الحدود السابقة.", "en": "If the 200 row starts adding from j=1 into the previous sum, the first hundred terms are counted twice. Resetting inside j is also wrong: it erases prior terms every iteration."}], "code": []}, {"title": {"ar": "فهم factorial قبل كود Q9", "en": "Understand factorial before Q9 code"}, "slide": 55, "takeaway": {"ar": "factorial تبدأ بواحد؛ حلقة 2 إلى i تحسبها وتتعامل تلقائيًا مع 0 و1.", "en": "Factorial starts at one; looping from two through i also handles zero and one correctly."}, "text": [{"ar": "قبل الحلقة، نفهم العلامة !: factorial يعني حاصل ضرب الأعداد الصحيحة من 1 لحد العدد. هو وصف حساب، مش عاملًا جاهزًا نكتبه بعد المتغير في C++.", "en": "First explain !: factorial multiplies the integers from one through the given number. It is mathematical notation, not a C++ postfix operator."}, {"ar": "0! معرف بأنه 1، وده يخلي الحد عند i=0 يساوي 1. في حلقات الضرب نبدأ fact=1 ثم نضرب في 2 إلى i؛ لو i صفر أو واحد لا نحتاج أي ضرب.", "en": "Zero factorial is defined as one, making the i=0 term equal to one. Start fact at one and multiply from two to i; for zero or one no multiplication is needed."}, {"ar": "استخدم double لأن factorial يكبر بسرعة؛ حتى 13! يتجاوز int ذي 32 بت. هنا i يحدد factorial المطلوبة، وj يعد عمليات الضرب فقط.", "en": "Use double because factorial grows quickly; even 13! exceeds a 32-bit int. Here i selects the factorial, while j counts its multiplications."}], "code": ["double fact=1;\nfor (int j=2; j<=i; ++j) {\n    fact=fact*j;\n}"]}], "verified": true};
let lang='ar',theme='light';try{lang=localStorage.getItem('gen241-s3-guide-lang')||'ar';theme=localStorage.getItem('gen241-s3-guide-theme')||'light'}catch(e){};
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tr=x=>typeof x==='string'?x:x[lang];
const txt=(a,e)=>lang==='ar'?a:e;
function latinRuns() {
  // A run starts with a Latin letter or digit, a signed number (−1, +0.014) or a bracketed
  // interval, and continues through digit separators and lists (2,297 · 2006–2019 · 6, 10) and spaced
  // operators (0.399 − 0.147, 281 / 790, TP 1 · FP 6) so Arabic never reorders them.
  return /(?:\+\+(?=[A-Za-z_])|--(?=[A-Za-z_])|[\u2212+\-\u2248]\d|\[[^\[\]\u0600-\u06ff]*\]|\((?=[A-Za-z0-9])[^()\u0600-\u06ff]*\)|[.@#]?[A-Za-z0-9])(?:[A-Za-z0-9_/+*^!%=&@#’'-]|\.\.(?=\d)|[.:](?=[A-Za-z0-9/])|[\u2013\u2212](?=[\u2212+\-]?\d)|, ?(?=[\u2212+\-]?\d)|[ \t]*[\u2212+=!*%&|\u00d7\/\u00b7<>\u2264\u2265\u2248\u2013\u2192-]+[ \t]*(?=[A-Za-z0-9\[\u2212+\-])|[ \t]+(?=[A-Za-z0-9\[\u2212])|\([^()\u0600-\u06ff]*\)|\[[^\[\]\u0600-\u06ff]*\])*/g;
}
function mixed(s){
 if(lang!=='ar')return esc(s);
 let re=latinRuns(),match,last=0,out='';
 while((match=re.exec(s))){out+=esc(s.slice(last,match.index))+'<bdi dir="ltr" lang="en">'+esc(match[0])+'</bdi>';last=re.lastIndex;}
 return out+esc(s.slice(last));
}

function diagram(q){
 let body='',label='';
 const ln=(x1,y1,x2,y2,c='blue')=>`<line class="${c}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
 const tx=(x,y,s)=>`<text x="${x}" y="${y}" text-anchor="middle">${s}</text>`;
 const circ='<circle class="blue" cx="300" cy="150" r="110"/>';
 if(q===1){body='<rect class="blue" x="200" y="35" width="210" height="210"/>'+tx(305,25,'s = 2')+tx(305,150,'n = 4')+tx(305,280,'area = 4');label=txt('مربع بسيط يراجع قانون المضلع المنتظم.','A simple square checks the regular-polygon formula.')}
 if(q===2){body='<path class="blue" d="M190 245 L430 245 L190 65 Z"/>'+tx(160,160,'a = 3')+tx(310,280,'b = 4')+tx(330,140,'c = 5')+tx(455,253,'A')+tx(180,45,'B')+tx(165,253,'C');label=txt('الزاوية C قائمة ومقابلة للضلع c=5. الرسم يحافظ على تناسب 3،4،5.','Angle C is right and faces c=5. The drawing preserves the 3:4:5 proportions.')}
 if(q===3){body=circ+ln(300,150,410,150,'orange')+ln(300,150,300,40,'orange')+'<path class="orange" d="M410 150 A110 110 0 0 0 300 40"/>'+tx(347,180,'R')+tx(340,125,'π/2')+tx(300,292,'d = R × π/2');label=txt('قطاع توضيحي في كرة، والقوس يوضح ربع لفة على السطح.','Schematic sphere cross-section showing a quarter-turn surface arc.')}
 if(q===4){body=circ+'<path class="orange" d="M410 150 L300 40 L190 150 Z"/>'+tx(445,148,'1')+tx(300,25,'2')+tx(165,148,'3')+tx(300,292,'r = 40');label=txt('حالة ثابتة للتحقق قبل العشوائية. الاتجاهات 0 وPI/2 وPI.','A fixed verification case before randomness, with directions 0,PI/2,PI.')}
 if(q===5){let pts=Array.from({length:5},(_,k)=>{let a=Math.PI/2+k*2*Math.PI/5;return [300+110*Math.cos(a),150-110*Math.sin(a)]});body=circ+`<polygon class="orange" points="${pts.map(x=>x.join(',')).join(' ')}"/>`+pts.map((v,k)=>`<circle class="dot" cx="${v[0]}" cy="${v[1]}" r="6"/>`+tx(v[0]+(v[0]-300)*.16,v[1]+(v[1]-150)*.16+6,String(k+1))).join('')+tx(300,292,'start = (0,r)');label=txt('نقط مرقمة بترتيب الزيارة، تبدأ من أعلى وتتحرك عكس عقارب الساعة.','Vertices numbered in visit order, starting at the top and moving counterclockwise.')}
 if(q===6){body=tx(170,80,'n = 14')+tx(170,140,'power = 16384')+ln(290,135,360,135,'orange')+tx(460,80,'next')+tx(460,140,'32768')+tx(300,240,'16384 < 30000 ≤ 32768');label=txt('القيمة الحالية مقبولة، لكن المضاعفة التالية تتجاوز الحد.','The current value is valid; the proposed doubling exceeds the limit.')}
 if(q===7){body=tx(300,90,'1  ×  1/5  ×  1/9  ×  1/13  ×  …')+tx(300,170,'5 → 9 → 13 → … → 97')+tx(300,245,'d = d + 4');label=txt('الناتج يبدأ بواحد، والمقام يتحرك بخطوة أربعة.','The product starts at one; the denominator advances by four.')}
 if(q===8){body=tx(300,85,'1 + 1/4 + 1/9 + … + 1/n²')+ln(300,110,300,160,'orange')+tx(300,205,'sqrt(6 × sum)')+tx(300,275,'n: 100, 200, 300, 400, 500, 600');label=txt('لكل n ابدأ مجموعًا جديدًا، أكمل الحدود، ثم احسب الجذر.','For each n, start a fresh sum, complete its terms, then take the square root.')}
 if(q===9){body=tx(300,65,'i = 0, 1, …, 15')+ln(300,90,300,130,'orange')+tx(300,165,'fact = 1 × 2 × … × i')+ln(300,185,300,220,'orange')+tx(300,265,'total += pow(x,i) / fact');label=txt('كل i تختار حدًا؛ احسب factorial الخاصة به، ثم أضف الحد مرة واحدة.','For each i, calculate its factorial, then add that term exactly once.')}
 if(q===10){body=tx(300,70,'18 and 12')+tx(300,135,'d = 12 → 11 → … → 6')+tx(300,205,'18 % 6 = 0')+tx(300,255,'12 % 6 = 0');label=txt('البحث تنازلي. أول مرشح يقسم العددين هو الأكبر.','Descending search: the first candidate dividing both inputs is the greatest.')}
 return `<figure class="diagram"><svg viewBox="0 0 620 310" role="img" aria-label="${esc(label)}">${body}</svg><figcaption>${mixed(label)}</figcaption></figure>`;
}
function foundations(){return `<section id="basics" class="foundation"><h2>${w('basics')}</h2><p>${txt('لو خطوة عطلتك، افتح شرحها هنا. مش لازم تقرأ كل الأقسام قبل كل سؤال.','If a step blocks you, open its explanation here. You do not need to reread every section for every problem.')}</p><div class="foundations-grid">${DATA.foundations.map(f=>`<details><summary>${mixed(tr(f.title))}</summary><div class="body">${f.text.map(x=>p(x)).join('')}${f.code.map(x=>`<pre><code>${CppInk.html(x)}</code></pre>`).join('')}<p><a href="slides.html#${f.slide}">${txt('افتح السبورة','Open this board')}</a></p></div></details>`).join('')}</div><h3>${txt('أدوات الرياضيات اللي هنستخدمها','The math tools we will use')}</h3><dl class="plan"><dt>cmath</dt><dd>${txt('sqrt للجذر، sin/cos/tan للزوايا بالـradians، acos للعكس، exp للمراجعة، وfabs للقيمة المطلقة.','sqrt for square root, sin/cos/tan for radians, acos for inverse cosine, exp for checking and fabs for absolute value.')}</dd><dt>PI</dt><dd>${txt("بعض الأمثلة تستخدم M_PI. نعرّف PI كثابت عشري في أول مثال. بعد شرح acos، يمكن حسابها بـacos(-1.0)، لأن cos(PI)=-1. الطريقتان لا تحتاجان امتداد M_PI.","Some examples use M_PI. The first example defines a decimal PI constant. After learning acos, PI can also be calculated as acos(-1.0), since cos(PI)=-1. Neither method needs the M_PI extension.")}</dd><dt>iomanip</dt><dd>${txt('fixed مع setprecision يحدد الخانات بعد العلامة. scientific يحافظ على وضوح الأعداد الصغيرة.','fixed with setprecision controls places after the decimal point. scientific keeps tiny values readable.')}</dd><dt>cstdlib / ctime</dt><dd>${txt('rand وsrand في cstdlib. time في ctime لو عايز تغير seed حسب الوقت.','rand and srand come from cstdlib. time comes from ctime when varying the seed by time.')}</dd></dl><div class="widget"><h3>${txt('حرك الزاوية وشوف نفس النقطة','Move the angle and follow the same point')}</h3><label for="angle">${txt('الزاوية بالـdegrees','Angle in degrees')}</label><input id="angle" type="range" min="0" max="360" step="30" value="90"><div class="diagram"><svg viewBox="0 0 620 300" role="img" aria-label="${txt('نقطة بتتحرك على دائرة نصف قطرها واحد','A point moving around a unit circle')}"><circle cx="310" cy="145" r="110" class="blue"/><line x1="170" y1="145" x2="450" y2="145" class="muted"/><line x1="310" y1="15" x2="310" y2="275" class="muted"/><line id="arm" x1="310" y1="145" x2="310" y2="35" class="orange"/><circle id="marker" cx="310" cy="35" r="7" class="dot"/></svg></div><output id="angle-output"></output><p class="small">${txt('رسم حسابي تفاعلي للشرح. دوال C++ نفسها موضحة في الأمثلة المسجلة.','Interactive mathematical illustration. The recorded examples show the actual C++ functions.')}</p></div><div class="widget"><h3>${txt('اتتبع loop واحدة بإيدك','Step through one loop yourself')}</h3><pre id="trace-code"><code>${CppInk.html("int i=1;\nwhile (i<=3) {\n    cout << i << endl;\n    i=i+1;\n}")}</code></pre><div class="trace-line" id="trace-state" aria-live="polite"></div><div class="trace-steps"><button id="trace-back">${txt('السابق','Back')}</button><button id="trace-next">${txt('الخطوة الجاية','Next step')}</button><button id="trace-reset">${txt('من الأول','Reset')}</button></div><p id="trace-reason"></p></div></section>`}
function question(q){return `<section id="q${q.n}" class="question"><div class="qhead"><span class="qnum">Q${String(q.n).padStart(2,'0')}</span><h2>${mixed(tr(q.title))}</h2></div><p class="tag"><a href="sheet-03.pdf#page=${q.n<=4?1:q.n<=9?2:3}">${txt('السؤال في الشيت الأصلي','Question in the original sheet')}</a> · <a href="slides.html#${q.slide}">${txt('شرحه في السلايدز','Its whiteboard explanation')}</a></p>${p(q.task)}${q.needs.length?`<p class="prerequisites">${txt('قبل الجزء ده راجع:','Before this section, review:')} ${q.needs.map(n=>`<a href="#q${n}">Q${n}</a>`).join(' · ')}</p>`:''}<div class="intuition">${p(q.intuition)}</div>${diagram(q.n)}<pre class="formula"><code>${esc(q.formula)}</code></pre><h3>${w('plan')}</h3><dl class="plan">${['WANT','HAVE','CONVERT','RELATE','CHECK'].map((x,i)=>`<dt>${x}</dt><dd>${mixed(tr(q.plan[i]))}</dd>`).join('')}</dl><details open class="lesson-explanation"><summary>${w('steps')}</summary>${q.lessons.map(l=>`<h3>${mixed(tr(l.title))}</h3>${l.paragraphs.map(x=>p(x)).join('')}${(l.code||[]).map(c=>`<pre><code>${CppInk.html(c)}</code></pre>`).join('')}<div class="intuition">${p(l.takeaway)}</div>`).join('')}</details><div class="note">${p(q.trap)}</div><details class="reference-reading"><summary>${txt("نفهم الحل المرجعي","Read the reference solution")}</summary>${p(q.reference_note)}${q.reference_code?`<pre><code>${CppInk.html(q.reference_code)}</code></pre>`:""}</details><div class="quiz" data-q="${q.n}"><span class="eyebrow">${w('attempt')}</span><h3>${mixed(tr(q.quiz))}</h3><div class="options">${q.opts.map((o,i)=>`<button data-choice="${i}" type="button">${mixed(tr(o))}</button>`).join('')}</div><p class="feedback" aria-live="polite"></p><div class="retry">${p(q.retry)}<details><summary>${txt('راجع بعد المحاولة','Check after attempting')}</summary>${p(q.retry_answer)}</details><button type="button" class="reset-quiz">${txt('جرب السؤال تاني','Retry the question')}</button></div></div><details class="code-reference"><summary>${w('code')}</summary><p class="small">${txt('مثال محلول للمقارنة بعد كتابة خطتك ومحاولتك. اكتب حلّك بنفسك واشرح كل تحديث، واتبع قواعد تسليم مجموعتك.','A worked reference for comparison after your plan and attempt. Write your own solution, explain every update and follow your class submission rules.')}</p><pre><code>${CppInk.html(q.code)}</code></pre></details><details class="test-records"><summary>${w('tests')}</summary><p class="small">${txt('Apple Clang على macOS، بمعيار C++98. الاختلافات الصغيرة في آخر رقم واردة. Q4 يستخدم seed ثابت؛ أرقامه تعتمد على مكتبة التشغيل.','Apple Clang on macOS, using C++98. Tiny final-digit differences are possible. Q4 uses a fixed seed; its numbers depend on the runtime library.')}</p>${q.tests.map(r=>`<div class="test"><span class="label">${txt('المدخل','Input')}</span><pre>${esc(r.input||txt('لا يوجد','None'))}</pre><span class="label">${txt('المخرج المسجل','Recorded output')}</span><pre>${esc(r.stdout)}</pre></div>`).join('')}</details></section>`}
function render(){let anchor=location.hash;document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.documentElement.dataset.theme=theme;$('#lang').textContent=lang==='ar'?'English':'العربية';$('#theme').textContent=txt(theme==='light'?'الوضع الداكن':'الوضع الفاتح',theme==='light'?'Dark theme':'Light theme');$('#print').textContent=txt('طباعة','Print');$('#nav').innerHTML=`<strong>${w('start')}</strong><a href="#start">${w('start')}</a><a href="#basics">${w('basics')}</a>${DATA.questions.map(q=>`<a href="#q${q.n}"><bdi>Q${q.n}</bdi> · ${mixed(tr(q.title))}</a>`).join('')}<a href="#finish">${txt('قبل التسليم','Before submission')}</a>`;$('#main').innerHTML=`<section class="hero" id="start"><p class="eyebrow">GEN241 · Sheet 3 · Guide</p><h1>${txt('افهم الخطوة، وبعدها اكتب الكود.','Understand the step. Then write the code.')}</h1><p class="lead">${txt('عشر مسائل، وطريقة واضحة تبدأ بيها كل واحدة. هنا هتلاقي الفكرة والرسم والخطة، وتجربة صغيرة قبل الكود الكامل.','Ten problems, with a clear way into each one. Find the idea, drawing, plan and a small attempt before the complete reference.')}</p><div class="actions"><a class="button" href="slides.html">${txt('افتح السلايدز','Open the slides')}</a><a class="button" href="sheet-03.pdf">${txt('الشيت الأصلي','Original sheet')}</a><a class="button" href="lecture-05.pdf">${txt('Lecture 5','Lecture 5')}</a></div></section><section class="workspace"><h2>${txt('ابدأ بحاجة صغيرة تقدر تراجعها','Start with something you can check')}</h2><p>${txt('لو القانون طويل، جرّبه على شكل مألوف. لو فيه loop، تتبع أول دورتين وآخر اختبار. استخدم السلايدز للشرح التدريجي، والـGuide للرجوع للسؤال اللي واقف معاك.','Test long formulas on familiar shapes. For a loop, trace the first two iterations and the final test. Use slides for progressive explanation and this Guide to revisit a particular question.')}</p><p>${txt('كل سؤال مرتب: افهم المطلوب، اكتب الخطة، جاوب سؤال صغير، وبعدها قارن بالكود والاختبارات. اقفل الحل لما تكتب محاولتك.','Each question follows a route: understand the task, write a plan, answer a short check, then compare code and tests. Hide the reference while writing your attempt.')}</p><h3>${txt('تجهيز ملف C++','Prepare a C++ file')}</h3><p>${txt('في Dev-C++ على Windows: File → New → Source File، ثم Ctrl+S واحفظ practice.cpp. بعد التعديل اختار Execute → Compile & Run أو F11. اسم practice مجرد تدريب، مش قاعدة تسليم.','In Dev-C++ on Windows, choose File → New → Source File, then Ctrl+S and save practice.cpp. After editing, use Execute → Compile & Run or F11. The practice name is an example, not a submission rule.')}</p><p>${txt('على Mac مع إعداد الكورس: افتح ملف .cpp في VS Code، ثم Terminal → Run Build Task أو Cmd+Shift+B.','On Mac with the course configuration, open the .cpp in VS Code and use Terminal → Run Build Task or Cmd+Shift+B.')}</p><p><a href="https://ahmedtolan2019.github.io/student-hub/computer-basics/#cpp">${txt('Guide الكمبيوتر، القسم 6: حفظ C++ على Windows','Computer Guide, section 6: save C++ on Windows')}</a></p></section><section class="workspace"><h2>${txt('ترتيب المذاكرة حسب الأساسيات','Study order follows prerequisites')}</h2><p>${txt('ابدأ بالمضلع والزوايا، ثم التكرار، ثم النقط والمتسلسلات والقواسم. ترتيب الأسئلة هنا مقصود: Q5 يجهزك لـQ4. تقدر ترجع لأي سؤال من القائمة.','Start with polygons and angles, then loops, points, series and divisors. The order is deliberate: Q5 prepares you for Q4. Use the menu to revisit any question.')}</p><p dir="ltr">${DATA.learningOrder.map(n=>`<a href="#q${n}">Q${n}</a>`).join(' → ')}</p></section>${foundations()}${DATA.learningOrder.map(n=>question(DATA.questions.find(q=>q.n===n))).join('')}<section class="workspace" id="finish"><h2>${txt('قبل ما تعتبر الحل خلص','Before calling the solution complete')}</h2><div class="checklist">${[txt('كتبت WANT وHAVE والتحويل والقانون واختبار بسيط.','I wrote the goal, inputs, conversion, relation and simple check.'),txt('أقدر أشرح كل متغير وكل تحديث من غير نسخ الشرح.','I can explain every variable and update in my own words.'),txt('جربت مدخلًا عاديًا ومدخلًا عند الحدود وسجلت النتائج.','I tried normal and boundary inputs and recorded the results.'),txt('حفظت آخر تعديل في ملف .cpp وبنيت البرنامج من جديد.','I saved the latest .cpp and rebuilt the program.'),txt('راجعت قواعد الاسم والفولدر والرفع الخاصة بمجموعتي.','I checked my class naming, folder and upload rules.')].map((x,i)=>`<label><input type="checkbox" data-check="${i}"><span>${x}</span></label>`).join('')}</div><p><a href="https://ahmedtolan2019.github.io/student-hub/computer-basics/#zip">${txt('القسم 8: عمل ZIP على Windows وMac','Section 8: create a ZIP on Windows or Mac')}</a> · <a href="https://ahmedtolan2019.github.io/student-hub/computer-basics/#check">${txt('القسم 11: فحص الملفات قبل الرفع','Section 11: check files before upload')}</a></p><h3>${w('sources')}</h3><p>${txt('المطلوب والقوانين من Sheet 3، الصفحات 1–3. Lecture 5 يشرح دوال الرياضيات في الصفحات 1–4 وتنسيق العرض في الصفحات 10–12. شرح loops مضاف كمتطلب لحل الشيت، ولا نفترض إنه موجود في ملف المحاضرة المرفق.','Tasks and formulas follow Sheet 3, pages 1–3. Lecture 5 covers math functions on pages 1–4 and output formatting on pages 10–12. Loop instruction is an added prerequisite for the sheet, not assumed to appear in the supplied lecture.')}</p><p>${txt('Q3 يحتفظ بإشارات وإعداد نصف القطر المذكورين في الشيت. Q5 يفسر البداية حسب الرسم. Q9 يحسب الفهارس 0 إلى 15، أي 16 حدًا. الأمثلة تفترض إدخال أرقام قابلة للقراءة ونطاقات معقولة؛ فحص النص غير الرقمي والأعداد القصوى خارج نطاق هذا الدرس.','Q3 preserves the sheet’s signs and radius. Q5 follows its drawing. Q9 uses indices zero through fifteen: sixteen terms. Examples assume parseable numeric input in reasonable ranges; malformed text and extreme magnitudes are outside this lesson.')}</p><p><a href="https://learn.microsoft.com/en-us/cpp/c-runtime-library/reference/sin-sinf-sinl">sin: radians</a> · <a href="https://learn.microsoft.com/en-us/cpp/c-runtime-library/reference/rand">rand and srand</a></p><p class="small">${txt('المحتوى والرسوم يعملوا بدون إنترنت. روابط المراجع الخارجية تحتاج إنترنت.','Content and drawings work offline. External reference links need a connection.')}</p></section><footer>${txt('استخدم الأسهم في السلايدز للخطوة التالية. E للشرح، S للمراجعة، L للغة، T للشكل.','In the slides, use arrows to advance, E for explanation, S for summary, L for language and T for theme.')}</footer>`;
 bind();isolateRendered();if(anchor){let el=document.getElementById(anchor.slice(1));if(el)el.scrollIntoView()}}
function isolateRendered(){
 if(lang!=='ar')return;
 const walker=document.createTreeWalker($('#main'),NodeFilter.SHOW_TEXT),nodes=[];let n;
 while(n=walker.nextNode())if(/[A-Za-z0-9]/.test(n.textContent)&&!n.parentElement.closest('bdi,pre,code,svg,script,style,output,[dir="ltr"]'))nodes.push(n);
 for(const node of nodes){const t=document.createElement('template');t.innerHTML=mixed(node.textContent);node.replaceWith(t.content);}
}
function bind(){document.querySelectorAll('.quiz').forEach(el=>{let q=DATA.questions.find(q=>q.n===+el.dataset.q);el.querySelectorAll('[data-choice]').forEach(btn=>btn.onclick=()=>{el.querySelectorAll('[data-choice]').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');el.querySelector('.feedback').innerHTML=mixed(tr(q.feedback[+btn.dataset.choice]))});el.querySelector('.reset-quiz').onclick=()=>{el.querySelector('.feedback').textContent='';el.querySelectorAll('[data-choice]').forEach(x=>x.classList.remove('selected'));el.querySelectorAll('details').forEach(x=>x.open=false)}});$('#angle').oninput=updateAngle;updateAngle();let trace=0;const states=['i = 1','1 <= 3 → true','print 1; i = 2','2 <= 3 → true','print 2; i = 3','3 <= 3 → true','print 3; i = 4','4 <= 3 → false; stop'];const reasons=[['البداية تحصل مرة واحدة.','Initialization happens once.'],['الشرط يسبق العرض.','Test before printing.'],['اطبع القيمة الحالية ثم زودها.','Print the current value, then increment.'],['ارجع للشرط بالقيمة الجديدة.','Return to the test with the new value.'],['الناتج حتى الآن 1 ثم 2.','Output so far is one, then two.'],['المساواة مسموحة في <=.','<= includes equality.'],['آخر مطبوع 3، لكن i أصبحت 4.','Last printed value is three, but i is now four.'],['4 لا تطبع لأن الجسم لم ينفذ.','Four is not printed because the body does not execute.']];function draw(){ const focus=[[1],[2],[3,4],[2],[3,4],[2],[3,4],[2]][trace];document.querySelectorAll('#trace-code .cpp-line').forEach(x=>{const on=focus.includes(+x.dataset.line);x.classList.toggle('executing',on);if(on)x.setAttribute('aria-current','step');else x.removeAttribute('aria-current')});$('#trace-state').textContent=states[trace];$('#trace-reason').innerHTML=mixed(reasons[trace][lang==='ar'?0:1]);$('#trace-back').disabled=trace===0;$('#trace-next').disabled=trace===states.length-1}$('#trace-next').onclick=()=>{trace=Math.min(trace+1,states.length-1);draw()};$('#trace-back').onclick=()=>{trace=Math.max(trace-1,0);draw()};$('#trace-reset').onclick=()=>{trace=0;draw()};draw();document.querySelectorAll('[data-check]').forEach(x=>{try{x.checked=localStorage.getItem('gen241-s3-check-'+x.dataset.check)==='1'}catch(e){}x.onchange=()=>{try{localStorage.setItem('gen241-s3-check-'+x.dataset.check,x.checked?'1':'0')}catch(e){}}})}
function updateAngle(){let d=+$('#angle').value,r=d*Math.PI/180,x=Math.cos(r),y=Math.sin(r);if(Math.abs(x)<1e-10)x=0;if(Math.abs(y)<1e-10)y=0;$('#marker').setAttribute('cx',310+110*x);$('#marker').setAttribute('cy',145-110*y);$('#arm').setAttribute('x2',310+110*x);$('#arm').setAttribute('y2',145-110*y);$('#angle-output').textContent=`${d} degrees = ${r.toFixed(6)} radians; (x,y) = (${x.toFixed(6)}, ${y.toFixed(6)})`}
$('#lang').onclick=()=>{lang=lang==='ar'?'en':'ar';try{localStorage.setItem('gen241-s3-guide-lang',lang)}catch(e){}render()};$('#theme').onclick=()=>{theme=theme==='light'?'dark':'light';document.documentElement.dataset.theme=theme;try{localStorage.setItem('gen241-s3-guide-theme',theme)}catch(e){}$('#theme').textContent=txt(theme==='light'?'الوضع الداكن':'الوضع الفاتح',theme==='light'?'Dark theme':'Light theme')};$('#print').onclick=()=>window.print();let wasOpen=[];window.addEventListener('beforeprint',()=>{wasOpen=[...document.querySelectorAll('details')].map(d=>d.open);document.querySelectorAll('details').forEach(d=>d.open=true)});window.addEventListener('afterprint',()=>document.querySelectorAll('details').forEach((d,i)=>d.open=wasOpen[i]));render();
