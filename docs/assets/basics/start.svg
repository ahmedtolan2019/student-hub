<svg xmlns="http://www.w3.org/2000/svg" width="840" height="510" viewBox="0 0 840 510" role="img" aria-labelledby="title desc"><title id="title">Meet your files &amp; folders</title><desc id="desc">Simplified instructional illustration. Documents  &gt;  My labs. 1 click = select. 2 clicks = open. Right-click = menu.</desc><rect width="840" height="510" rx="20" fill="#eef2ff"/><g font-family="system-ui, sans-serif"><rect x="24" y="24" width="792" height="456" rx="12" fill="white" stroke="#cbd5e1"/><path d="M36 24h768a12 12 0 0 1 12 12v34H24V36a12 12 0 0 1 12-12" fill="#e2e8f0"/><text x="44" y="54" font-size="19" fill="#334155" font-weight="600">Files &amp; folders</text><text x="44" y="104" font-size="17" fill="#334155" font-weight="400">Documents  &gt;  My labs</text><path d="M24 122h792M185 122v358" stroke="#e2e8f0"/><text x="43" y="165" font-size="16" fill="#334155" font-weight="400">Documents</text><text x="43" y="204" font-size="16" fill="#334155" font-weight="400">Downloads</text><text x="43" y="243" font-size="16" fill="#334155" font-weight="400">My labs</text><rect x="199" y="137" width="265" height="326" rx="8" fill="#f8fafc"/><path d="M216 152h16l7 6h25v30h-48Z" fill="#fbbf24" stroke="#d99b20"/><text x="279" y="177" font-size="17" fill="#334155" font-weight="500">Lab 01</text><path d="M222 219h26l10 10v33h-36Z" fill="#e0e7ff" stroke="#818cf8"/><path d="M248 219v10h10M229 239h20m-20 8h16" fill="none" stroke="#6366f1"/><text x="279" y="247" font-size="17" fill="#334155" font-weight="500">hello.cpp</text><path d="M222 289h26l10 10v33h-36Z" fill="#e0e7ff" stroke="#818cf8"/><path d="M248 289v10h10M229 309h20m-20 8h16" fill="none" stroke="#6366f1"/><text x="279" y="317" font-size="17" fill="#334155" font-weight="500">hello.py</text><path d="M222 359h26l10 10v33h-36Z" fill="#e0e7ff" stroke="#818cf8"/><path d="M248 359v10h10M229 379h20m-20 8h16" fill="none" stroke="#6366f1"/><text x="279" y="387" font-size="17" fill="#334155" font-weight="500">Guide.pdf</text><rect x="482" y="137" width="314" height="326" rx="8" fill="white" stroke="#c7d2fe"/><text x="503" y="170" font-size="12" fill="#4f46e5" font-weight="700">ACTION GUIDE</text><circle cx="510" cy="205" r="12" fill="#4f46e5"/><text x="506" y="210" font-size="13" fill="white" font-weight="600">1</text><text x="531" y="210" font-size="15" fill="#334155" font-weight="400">1 click = select</text><circle cx="510" cy="267" r="12" fill="#4f46e5"/><text x="506" y="272" font-size="13" fill="white" font-weight="600">2</text><text x="531" y="272" font-size="15" fill="#334155" font-weight="400">2 clicks = open</text><circle cx="510" cy="329" r="12" fill="#4f46e5"/><text x="506" y="334" font-size="13" fill="white" font-weight="600">3</text><text x="531" y="334" font-size="15" fill="#334155" font-weight="400">Right-click = menu</text><text x="26" y="501" font-size="12" fill="#607087" font-weight="400">ILLUSTRATION · Menus and appearance vary by version.</text></g></svg>